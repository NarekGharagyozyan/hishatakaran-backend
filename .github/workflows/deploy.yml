name: Deploy Backend

on:
  push:
    branches:
      - production

concurrency:
  group: backend-production
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Build
        run: ./mvnw clean package -DskipTests

      - name: Install SSH key
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.SERVER_SSH_KEY }}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -H ${{ secrets.SERVER_HOST }} >> ~/.ssh/known_hosts

      - name: Copy JAR
        run: |
          scp -i ~/.ssh/id_ed25519 \
            target/*.jar \
            ${{ secrets.SERVER_USER }}@${{ secrets.SERVER_HOST }}:/tmp/backend.jar

      - name: Deploy
        run: |
          ssh -i ~/.ssh/id_ed25519 \
            ${{ secrets.SERVER_USER }}@${{ secrets.SERVER_HOST }} << 'EOF'

          mkdir -p /var/www/hishatakaran/backend/backups

          if [ -f /var/www/hishatakaran/backend/backend.jar ]; then
            cp /var/www/hishatakaran/backend/backend.jar \
               /var/www/hishatakaran/backend/backups/backend-$(date +%F-%H%M%S).jar
          fi

          mv /tmp/backend.jar /var/www/hishatakaran/backend/backend.jar

          systemctl restart hishatakaran-backend

          systemctl is-active --quiet hishatakaran-backend
          EOF
