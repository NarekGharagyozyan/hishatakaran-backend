name: Deploy Backend

on:
  push:
    branches:
      - production

concurrency:
  group: backend-production
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Make Maven Wrapper executable
        run: chmod +x mvnw

      - name: Verify Maven Wrapper
        run: ./mvnw --version

      - name: Build application
        run: ./mvnw clean package -DskipTests

      - name: Find application JAR
        run: |
          JAR=$(find target -maxdepth 1 -type f -name "*.jar" \
            ! -name "*-sources.jar" \
            ! -name "*-javadoc.jar" | head -n1)

          if [ -z "$JAR" ]; then
            echo "Application JAR not found"
            exit 1
          fi

          echo "JAR=$JAR" >> $GITHUB_ENV
          echo "Using JAR: $JAR"

      - name: Install SSH key
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.SERVER_SSH_KEY }}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -H "${{ secrets.SERVER_HOST }}" >> ~/.ssh/known_hosts

      - name: Upload JAR
        run: |
          scp -i ~/.ssh/id_ed25519 \
            "$JAR" \
            ${{ secrets.SERVER_USER }}@${{ secrets.SERVER_HOST }}:/tmp/backend.jar

      - name: Deploy
        run: |
          ssh -i ~/.ssh/id_ed25519 \
            ${{ secrets.SERVER_USER }}@${{ secrets.SERVER_HOST }} << 'EOF'

            set -e

            APP_DIR="/var/www/hishatakaran/backend"
            BACKUP_DIR="$APP_DIR/backups"

            mkdir -p "$BACKUP_DIR"

            if [ -f "$APP_DIR/backend.jar" ]; then
              cp "$APP_DIR/backend.jar" \
                 "$BACKUP_DIR/backend-$(date +%Y%m%d-%H%M%S).jar"
            fi

            mv /tmp/backend.jar "$APP_DIR/backend.jar"

            systemctl restart hishatakaran-backend.service

            sleep 5

            systemctl is-active --quiet hishatakaran-backend.service

            curl --fail --silent http://127.0.0.1:8080/actuator/health >/dev/null

            echo "Deployment completed successfully."

          EOF
